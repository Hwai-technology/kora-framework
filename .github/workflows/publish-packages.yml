name: Publish Packages & Releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_docker:
        description: 'Publish Container to GitHub Container Registry (ghcr.io)'
        required: true
        type: boolean
        default: true
      publish_npm:
        description: 'Publish npm package to GitHub Packages'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Prepare Release Metadata, Distinguish Features/Fixes & Bump Version
  # ----------------------------------------------------------------------------
  prepare-release:
    name: Compute SemVer & Generate Release Notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.notes.outputs.version }}
      tag_name: ${{ steps.notes.outputs.tag_name }}
      release_name: ${{ steps.notes.outputs.release_name }}
      bump_type: ${{ steps.notes.outputs.bump_type }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Calculate Version & Categorize Release
        id: notes
        run: python3 scripts/release_notes.py

      - name: Upload Release Notes Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  # ----------------------------------------------------------------------------
  # Job 2: Build & Attach Precompiled Release Binaries (Runs on every push to main & tags)
  # ----------------------------------------------------------------------------
  release-binaries:
    name: Build & Attach Release Binaries
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Release Notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Kora Release Binary
        run: cargo build --release -p kora-cli

      - name: Package Binary Artifacts
        id: package
        run: |
          TAG="${{ needs.prepare-release.outputs.tag_name }}"
          TAR_VER="kora-${TAG}-linux-x86_64.tar.gz"
          TAR_LATEST="kora-latest-linux-x86_64.tar.gz"

          # Package versioned archive
          tar -czvf "${TAR_VER}" -C target/release kora
          sha256sum "${TAR_VER}" > "${TAR_VER}.sha256"

          # Package latest archive alias
          cp "${TAR_VER}" "${TAR_LATEST}"
          sha256sum "${TAR_LATEST}" > "${TAR_LATEST}.sha256"

          echo "tar_ver=${TAR_VER}" >> $GITHUB_OUTPUT
          echo "tar_latest=${TAR_LATEST}" >> $GITHUB_OUTPUT

      - name: Tag commit on main
        if: github.ref == 'refs/heads/main'
        run: |
          TAG="${{ needs.prepare-release.outputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push -f origin "$TAG"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          name: ${{ needs.prepare-release.outputs.release_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            ${{ steps.package.outputs.tar_ver }}
            ${{ steps.package.outputs.tar_ver }}.sha256
            ${{ steps.package.outputs.tar_latest }}
            ${{ steps.package.outputs.tar_latest }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------------
  # Job 3: Publish Container Image to GitHub Container Registry (ghcr.io)
  # ----------------------------------------------------------------------------
  publish-container:
    name: Build & Push Docker Image to GHCR
    needs: prepare-release
    if: github.event_name != 'workflow_dispatch' || inputs.publish_docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.prepare-release.outputs.tag_name }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 4: Publish npm Wrapper Package to GitHub Packages
  # ----------------------------------------------------------------------------
  publish-npm:
    name: Publish npm Package to GitHub Packages
    needs: prepare-release
    if: github.event_name != 'workflow_dispatch' || inputs.publish_npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@hwai-technology'

      - name: Update package.json version
        working-directory: packages/npm
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          node -e "const pkg = require('./package.json'); pkg.version = '${VERSION}'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2));"

      - name: Publish to GitHub Packages
        working-directory: packages/npm
        run: |
          npm publish || echo "Package version may already be published."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
