name: Publish Packages & Releases

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_docker:
        description: 'Publish Container to GitHub Container Registry (ghcr.io)'
        required: true
        type: boolean
        default: true
      publish_npm:
        description: 'Publish npm package to GitHub Packages'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Publish Container Image to GitHub Container Registry (ghcr.io)
  # ----------------------------------------------------------------------------
  publish-container:
    name: Build & Push Docker Image to GHCR
    if: github.event_name != 'workflow_dispatch' || inputs.publish_docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 2: Publish npm Wrapper Package to GitHub Packages
  # ----------------------------------------------------------------------------
  publish-npm:
    name: Publish npm Package to GitHub Packages
    if: github.event_name != 'workflow_dispatch' || inputs.publish_npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@hwai-technology'

      - name: Publish to GitHub Packages
        working-directory: packages/npm
        run: |
          # Only publish if this version does not already exist in registry
          npm publish || echo "Package version may already be published."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------------
  # Job 3: Build & Attach Precompiled Release Binaries (on tag push)
  # ----------------------------------------------------------------------------
  release-binaries:
    name: Build & Attach Release Binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Kora Release Binary
        run: cargo build --release --bin kora

      - name: Package Binary Artifacts
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_NAME="kora-v${VERSION}-linux-x86_64.tar.gz"
          tar -czvf "${ARCHIVE_NAME}" -C target/release kora
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kora Framework ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.archive_name }}
            ${{ steps.package.outputs.archive_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

