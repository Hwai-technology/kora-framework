name: Publish Packages & Releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_docker:
        description: 'Publish Container to GitHub Container Registry (ghcr.io)'
        required: true
        type: boolean
        default: true
      publish_npm:
        description: 'Publish npm package to GitHub Packages'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Prepare Release Metadata, Distinguish Features/Fixes & Bump Version
  # ----------------------------------------------------------------------------
  prepare-release:
    name: Compute SemVer & Generate Release Notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.notes.outputs.version }}
      tag_name: ${{ steps.notes.outputs.tag_name }}
      release_name: ${{ steps.notes.outputs.release_name }}
      bump_type: ${{ steps.notes.outputs.bump_type }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Calculate Version & Categorize Release
        id: notes
        run: python3 scripts/release_notes.py

      - name: Upload Release Notes Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  # ----------------------------------------------------------------------------
  # Job 2: Build Native Binaries Matrix (Linux, Windows, macOS Apple Silicon & Intel)
  # ----------------------------------------------------------------------------
  build-binaries:
    name: Build Binary (${{ matrix.target.platform }})
    needs: prepare-release
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - platform: linux-x86_64
            os: ubuntu-latest
            archive: tar
          - platform: windows-x86_64
            os: windows-latest
            archive: zip
          - platform: darwin-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            archive: tar
          - platform: darwin-x86_64
            os: macos-latest
            rust_target: x86_64-apple-darwin
            archive: tar
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.rust_target }}

      - name: Build Kora Release Binary
        shell: bash
        run: |
          if [ -n "${{ matrix.target.rust_target }}" ]; then
            cargo build --release -p kora-cli --target ${{ matrix.target.rust_target }}
            mkdir -p target/release
            cp target/${{ matrix.target.rust_target }}/release/kora target/release/kora
          else
            cargo build --release -p kora-cli
          fi

      # Linux Packaging (Tarball + Standalone AppImage)
      - name: Package Linux Artifacts
        if: matrix.target.platform == 'linux-x86_64'
        shell: bash
        run: |
          mkdir -p dist
          TAG="${{ needs.prepare-release.outputs.tag_name }}"
          TAR_VER="dist/kora-${TAG}-linux-x86_64.tar.gz"
          TAR_LATEST="dist/kora-latest-linux-x86_64.tar.gz"

          # 1. Standard Tarball
          tar -czvf "${TAR_VER}" -C target/release kora
          sha256sum "${TAR_VER}" > "${TAR_VER}.sha256"
          cp "${TAR_VER}" "${TAR_LATEST}"
          sha256sum "${TAR_LATEST}" > "${TAR_LATEST}.sha256"

          # 2. Linux AppImage
          ./scripts/package_appimage.sh dist
          if [ -f "dist/kora-x86_64.AppImage" ]; then
            mv dist/kora-x86_64.AppImage "dist/kora-${TAG}-linux-x86_64.AppImage"
            cp "dist/kora-${TAG}-linux-x86_64.AppImage" "dist/kora-latest-linux-x86_64.AppImage"
            sha256sum "dist/kora-${TAG}-linux-x86_64.AppImage" > "dist/kora-${TAG}-linux-x86_64.AppImage.sha256"
            sha256sum "dist/kora-latest-linux-x86_64.AppImage" > "dist/kora-latest-linux-x86_64.AppImage.sha256"
          fi

      # Windows Packaging (Zip + Standalone kora.exe)
      - name: Package Windows Artifacts
        if: matrix.target.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $TAG = "${{ needs.prepare-release.outputs.tag_name }}"
          $ExePath = "target\release\kora.exe"
          $ZipVer = "dist\kora-$TAG-windows-x86_64.zip"
          $ZipLatest = "dist\kora-latest-windows-x86_64.zip"

          Compress-Archive -Path $ExePath -DestinationPath $ZipVer -Force
          Copy-Item $ZipVer $ZipLatest -Force
          Copy-Item $ExePath "dist\kora.exe" -Force

          (Get-FileHash -Path $ZipVer -Algorithm SHA256).Hash + "  kora-$TAG-windows-x86_64.zip" | Out-File -FilePath "$ZipVer.sha256" -Encoding ascii
          (Get-FileHash -Path $ZipLatest -Algorithm SHA256).Hash + "  kora-latest-windows-x86_64.zip" | Out-File -FilePath "$ZipLatest.sha256" -Encoding ascii

      # macOS Packaging (Tarball for arm64 / x86_64)
      - name: Package macOS Artifacts
        if: startsWith(matrix.target.platform, 'darwin')
        shell: bash
        run: |
          mkdir -p dist
          TAG="${{ needs.prepare-release.outputs.tag_name }}"
          PLAT="${{ matrix.target.platform }}"
          TAR_VER="dist/kora-${TAG}-${PLAT}.tar.gz"
          TAR_LATEST="dist/kora-latest-${PLAT}.tar.gz"

          tar -czvf "${TAR_VER}" -C target/release kora
          shasum -a 256 "${TAR_VER}" > "${TAR_VER}.sha256"
          cp "${TAR_VER}" "${TAR_LATEST}"
          shasum -a 256 "${TAR_LATEST}" > "${TAR_LATEST}.sha256"

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target.platform }}
          path: dist/*

  # ----------------------------------------------------------------------------
  # Job 2b: Package VS Code Extension (.vsix)
  # ----------------------------------------------------------------------------
  package-extension:
    name: Package VS Code Extension (.vsix)
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Build and Package VS Code Extension
        working-directory: integrations/vscode
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          npm install
          npx @vscode/vsce package --no-git-tag-version --version "${VERSION}" --out "../../dist/kora-vscode-${VERSION}.vsix"
          cp "../../dist/kora-vscode-${VERSION}.vsix" "../../dist/kora-vscode-latest.vsix"

      - name: Upload VS Code Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-vscode-extension
          path: dist/*

  # ----------------------------------------------------------------------------
  # Job 3: Collate All Multi-Platform Artifacts & Publish GitHub Release
  # ----------------------------------------------------------------------------
  publish-release:
    name: Collate & Publish GitHub Release
    needs: [prepare-release, build-binaries, package-extension]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Release Notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Download All Binaries Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: binaries-*
          merge-multiple: true

      - name: Tag commit on main
        if: github.ref == 'refs/heads/main'
        run: |
          TAG="${{ needs.prepare-release.outputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push -f origin "$TAG"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          name: ${{ needs.prepare-release.outputs.release_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------------
  # Job 4: Publish Container Image to GitHub Container Registry (ghcr.io)
  # ----------------------------------------------------------------------------
  publish-container:
    name: Build & Push Docker Image to GHCR
    needs: prepare-release
    if: github.event_name != 'workflow_dispatch' || inputs.publish_docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.prepare-release.outputs.tag_name }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 5: Publish npm Wrapper Package to GitHub Packages
  # ----------------------------------------------------------------------------
  publish-npm:
    name: Publish npm Package to GitHub Packages
    needs: prepare-release
    if: github.event_name != 'workflow_dispatch' || inputs.publish_npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@hwai-technology'

      - name: Update package.json version
        working-directory: packages/npm
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          node -e "const pkg = require('./package.json'); pkg.version = '${VERSION}'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2));"

      - name: Publish to GitHub Packages
        working-directory: packages/npm
        run: |
          npm publish || echo "Package version may already be published."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
