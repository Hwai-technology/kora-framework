services:
  app:
    build: .
    container_name: koraplay-app
    ports:
      - "7582:7582"
    environment:
      - PORT=7582
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://kora_user:kora_secret@postgres:5432/koraplay_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: koraplay-postgres
    environment:
      POSTGRES_USER: kora_user
      POSTGRES_PASSWORD: kora_secret
      POSTGRES_DB: koraplay_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kora_user -d koraplay_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: koraplay-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
