services:
  # 1. Kora Application Service
  kora-app:
    build:
      context: ..
      dockerfile: integrations/docker/Dockerfile
    container_name: kora_app_server
    restart: always
    ports:
      - "7582:7582"
    environment:
      - KORA_ENV=production
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=7582
      - DATABASE_URL=mysql://kora_user:kora_secret_pass@mysql-db:3306/kora_production
      - REDIS_URL=redis://redis-cache:6379
      - JWT_SECRET=super_secret_jwt_key_with_at_least_32_bytes_length
    depends_on:
      mysql-db:
        condition: service_healthy
      redis-cache:
        condition: service_started
    networks:
      - kora-network

  # 2. MySQL Database Service
  mysql-db:
    image: mysql:8.4
    container_name: kora_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_master_password
      MYSQL_DATABASE: kora_production
      MYSQL_USER: kora_user
      MYSQL_PASSWORD: kora_secret_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "kora_user", "-pkora_secret_pass"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kora-network

  # 3. Redis In-Memory Cache & Realtime PubSub
  redis-cache:
    image: redis:7-alpine
    container_name: kora_redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - kora-network

volumes:
  mysql-data:
  redis-data:

networks:
  kora-network:
    driver: bridge

