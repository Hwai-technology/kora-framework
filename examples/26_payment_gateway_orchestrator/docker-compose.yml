version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kora_payment_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: payment_gateway_db
      POSTGRES_USER: kora_pay_user
      POSTGRES_PASSWORD: kora_pay_secret_password
    volumes:
      - pg_payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kora_pay_user -d payment_gateway_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kora_payment_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "kora_redis_payment_pass"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "kora_redis_payment_pass", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_payment_data:
