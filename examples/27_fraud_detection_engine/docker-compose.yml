version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: kora_fraud_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "kora_fraud_redis_pass"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "kora_fraud_redis_pass", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: kora_fraud_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fraud_analytics_db
      POSTGRES_USER: kora_fraud_user
      POSTGRES_PASSWORD: kora_fraud_secret_pass
    volumes:
      - pg_fraud_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kora_fraud_user -d fraud_analytics_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_fraud_data:
